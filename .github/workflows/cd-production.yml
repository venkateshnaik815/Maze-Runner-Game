name: CD — Deploy to Production

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: cd-production
  cancel-in-progress: false   # never cancel production deploys

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/maze-runner

jobs:
  build-and-push:
    name: Build & Push Release Images
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.ref_name }}
            ${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.ref_name }}
            ${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to Production (Manual Approval Required)
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production   # requires manual approval in GitHub Environments

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: Update image tags in manifests
        run: |
          sed -i "s|IMAGE_TAG_PLACEHOLDER|${{ github.ref_name }}|g" k8s/backend/deployment.yaml
          sed -i "s|IMAGE_TAG_PLACEHOLDER|${{ github.ref_name }}|g" k8s/frontend/deployment.yaml

      - name: Deploy to production namespace
        run: |
          kubectl apply -f k8s/ --namespace=production --recursive

      - name: Wait for rollout (backend)
        run: kubectl rollout status deployment/maze-runner-backend -n production --timeout=600s

      - name: Wait for rollout (frontend)
        run: kubectl rollout status deployment/maze-runner-frontend -n production --timeout=600s

      - name: Run production smoke tests
        run: |
          PROD_URL="${{ vars.PRODUCTION_URL }}"
          echo "Running production smoke tests..."
          curl -f "${PROD_URL}/api/v1/actuator/health" || exit 1
          echo "✅ Production smoke tests passed!"

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: deploy-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges | head -50)
          fi
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: 🚀 Maze Runner Platform ${{ github.ref_name }}
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.changes }}

            ## Docker Images

            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/maze-runner-backend:${{ github.ref_name }}
            docker pull ghcr.io/${{ github.repository_owner }}/maze-runner-frontend:${{ github.ref_name }}
            ```

            ## Deployment

            See [DEPLOYMENT.md](https://github.com/${{ github.repository }}/blob/main/docs/DEPLOYMENT.md) for deployment instructions.
          draft: false
          prerelease: false
