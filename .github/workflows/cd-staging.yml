name: CD — Deploy to Staging

on:
  push:
    branches: [ develop ]

concurrency:
  group: cd-staging
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/maze-runner

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-backend:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-frontend:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging (Kubernetes)
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Update image tags in manifests
        run: |
          sed -i "s|IMAGE_TAG_PLACEHOLDER|${{ github.sha }}|g" k8s/backend/deployment.yaml
          sed -i "s|IMAGE_TAG_PLACEHOLDER|${{ github.sha }}|g" k8s/frontend/deployment.yaml

      - name: Deploy to staging namespace
        run: |
          kubectl apply -f k8s/ --namespace=staging --recursive

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/maze-runner-backend -n staging --timeout=300s
          kubectl rollout status deployment/maze-runner-frontend -n staging --timeout=300s

      - name: Run smoke tests
        run: |
          STAGING_URL="${{ vars.STAGING_URL }}"
          echo "Running smoke tests against ${STAGING_URL}..."
          curl -f "${STAGING_URL}/api/v1/actuator/health" || exit 1
          echo "✅ Smoke tests passed!"

      - name: Notify on success
        if: success()
        run: echo "✅ Deployed to staging successfully! SHA=${{ github.sha }}"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Staging deployment failed! SHA=${{ github.sha }}"
