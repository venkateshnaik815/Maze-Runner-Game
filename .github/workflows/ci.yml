name: CI — Build, Test & Quality Gate

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/maze-runner

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Backend — Build & Unit Tests
  # ─────────────────────────────────────────────
  backend-unit-test:
    name: Backend — Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run unit tests
        run: mvn clean test -Punit-tests --no-transfer-progress

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-results
          path: backend/target/surefire-reports/

  # ─────────────────────────────────────────────
  # Job 2: Backend — Integration Tests (Testcontainers)
  # ─────────────────────────────────────────────
  backend-integration-test:
    name: Backend — Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Testcontainers handles its own containers, but we keep Docker available
      docker:
        image: docker:dind
        options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run integration tests with coverage
        run: mvn clean verify -Pintegration-tests,coverage --no-transfer-progress

      - name: Check coverage threshold (≥ 90%)
        run: |
          COVERAGE=$(cat target/site/jacoco/index.html | grep -o 'Total[^%]*%' | grep -o '[0-9]*%' | head -1 | tr -d '%')
          echo "Coverage: ${COVERAGE}%"
          if [ "${COVERAGE}" -lt 90 ]; then
            echo "❌ Coverage ${COVERAGE}% is below the 90% threshold!"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets the 90% threshold."

      - name: Upload JaCoCo HTML report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-test-results
          path: backend/target/failsafe-reports/

  # ─────────────────────────────────────────────
  # Job 3: Backend — Static Analysis & Lint
  # ─────────────────────────────────────────────
  backend-quality:
    name: Backend — Code Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run Checkstyle
        run: mvn checkstyle:check --no-transfer-progress

      - name: Run SpotBugs
        run: mvn spotbugs:check --no-transfer-progress

  # ─────────────────────────────────────────────
  # Job 4: Frontend — Lint, Type-check & Unit Tests
  # ─────────────────────────────────────────────
  frontend-test:
    name: Frontend — Tests & Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (TypeScript)
        run: npm run type-check

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Check frontend coverage threshold (≥ 85%)
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | node -e "
            const d = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
            const s = d.total.statements;
            console.log(Math.round(s.pct));
          ")
          echo "Frontend coverage: ${COVERAGE}%"
          if [ "${COVERAGE}" -lt 85 ]; then
            echo "❌ Frontend coverage ${COVERAGE}% is below 85%!"
            exit 1
          fi
          echo "✅ Frontend coverage ${COVERAGE}% passes."

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/

  # ─────────────────────────────────────────────
  # Job 5: Security Scanning
  # ─────────────────────────────────────────────
  security-scan:
    name: Security — OWASP + npm audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: OWASP Dependency Check (Backend)
        run: |
          cd backend
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            --no-transfer-progress
        continue-on-error: false

      - name: npm audit (Frontend)
        run: |
          cd frontend
          npm audit --audit-level=high

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: backend/target/dependency-check-report.html

  # ─────────────────────────────────────────────
  # Job 6: Build Docker Images
  # ─────────────────────────────────────────────
  build-docker:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    needs: [ backend-unit-test, frontend-test ]
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

  # ─────────────────────────────────────────────
  # CI Summary Gate — all jobs must pass
  # ─────────────────────────────────────────────
  ci-success:
    name: CI — All Checks Passed
    runs-on: ubuntu-latest
    needs: [ backend-unit-test, backend-integration-test, backend-quality, frontend-test, security-scan ]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.backend-unit-test.result }}" != "success" ]] || \
             [[ "${{ needs.backend-integration-test.result }}" != "success" ]] || \
             [[ "${{ needs.backend-quality.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-test.result }}" != "success" ]] || \
             [[ "${{ needs.security-scan.result }}" != "success" ]]; then
            echo "❌ One or more CI jobs failed."
            exit 1
          fi
          echo "✅ All CI checks passed!"
