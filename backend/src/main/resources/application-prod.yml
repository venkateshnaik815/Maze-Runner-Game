# ─── Production Profile ─────────────────────────────────────────
# All sensitive values come from Kubernetes Secrets / environment variables
# NEVER hardcode secrets in this file
# ─────────────────────────────────────────────────────────────────

spring:
  # ─── DataSource ──────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: MazeRunnerHikariPool-Prod
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  # ─── JPA (prod: no SQL logging) ──────────────────────────────
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

  # ─── Mail (prod: real SMTP) ──────────────────────────────────
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ─── Server (prod: additional hardening) ─────────────────────────
server:
  tomcat:
    max-threads: 200
    min-spare-threads: 10
    accept-count: 100

# ─── Logging (prod: INFO only, structured JSON) ───────────────────
logging:
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%level","thread":"%thread","traceId":"%X{traceId}","logger":"%logger{36}","message":"%msg"}%n'
  level:
    root: WARN
    com.mazerunner: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO

# ─── Management (prod: restrict) ──────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
