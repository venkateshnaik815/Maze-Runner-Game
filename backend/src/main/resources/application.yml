# ─────────────────────────────────────────────────────────────────
# Maze Runner Game — Backend Application Configuration
# Active profile: default (base config, overridden by profile-specific YAMLs)
# ─────────────────────────────────────────────────────────────────

spring:
  application:
    name: maze-runner-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ─── JPA / Hibernate ─────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway manages schema — never let Hibernate modify it
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false

  # ─── Flyway ──────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
    table: schema_history

  # ─── Redis ────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # ─── Cache ────────────────────────────────────────────────────
  cache:
    type: redis
    redis:
      time-to-live: 600000          # 10 minutes default TTL
      cache-null-values: false

  # ─── Mail ────────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

  # ─── Jackson (JSON serialization) ────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC

# ─── Server ───────────────────────────────────────────────────────
server:
  port: ${BACKEND_PORT:8080}
  servlet:
    context-path: /api/v1
  error:
    include-message: never        # Never expose internal error messages
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  compression:
    enabled: true
    min-response-size: 1024

# ─── JWT Configuration ────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:default_dev_secret_must_be_changed_in_production_256bits}
    access-token-expiry-ms: ${JWT_ACCESS_TOKEN_EXPIRY_MS:900000}     # 15 minutes
    refresh-token-expiry-days: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS:7}    # 7 days
  cors:
    allowed-origins: ${BACKEND_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:noreply@maze-runner.app}
    base-url: ${APP_BASE_URL:http://localhost:3000}
  upload:
    avatar-max-size-bytes: 5242880    # 5MB
    allowed-types: image/jpeg,image/png,image/webp

# ─── Actuator / Health ────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  info:
    git:
      mode: full

# ─── SpringDoc / OpenAPI ──────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    filter: true
    display-request-duration: true
  show-actuator: false
  packages-to-scan: com.mazerunner.presentation.rest

# ─── Logging ──────────────────────────────────────────────────────
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.mazerunner: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
